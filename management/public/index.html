<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ProxyStop — Management Console</title>
<style>
  :root {
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --radius: 10px;
  }
  /* ---- theme tokens, matched to Passport (formerly GUS) so any app
     behind the same login feels like one product family. Passport
     defaults to blueSharp (bound to bare html below, same as Passport
     itself) — ProxyStop follows suit for the brief pre-login instant too,
     though every signed-in view immediately applies the admin's real
     profile.theme regardless. ---- */
  [data-theme="ember"] {
    --bg: #0b0e11; --bg-alt: #12161b; --surface: #12161b; --surface-2: #181d24;
    --border: #252b34; --border-soft: #1c212a;
    --text: #e8e6e1; --text-dim: #818996; --text-faint: #4f5561;
    --accent: #ff8a3d; --accent-dim: #d8701f; --accent-glow: rgba(255,138,61,0.20);
    --green: #45bf9f; --red: #e2585f; --yellow: #e0b84c; --blue: #5b9dd9;
  }
  [data-theme="ocean"] {
    --bg: #070f18; --bg-alt: #0f1c2c; --surface: #142438; --surface-2: #1a2d44;
    --border: #5a8abd; --border-soft: #35547d;
    --text: #f1f7fd; --text-dim: #b7c9dd; --text-faint: #7e93ac;
    --accent: #5fc4f5; --accent-dim: #43a2cc; --accent-glow: rgba(95,196,245,0.22);
    --green: #7fdcb8; --red: #f07871; --yellow: #eec35c; --blue: #83b8e6;
  }
  [data-theme="forest"] {
    --bg: #0a1209; --bg-alt: #13200f; --surface: #182818; --surface-2: #203420;
    --border: #63925d; --border-soft: #3d5c3a;
    --text: #f3f9f0; --text-dim: #bcd4bb; --text-faint: #839a80;
    --accent: #7fe08b; --accent-dim: #5fbf6b; --accent-glow: rgba(127,224,139,0.22);
    --green: #8ed68e; --red: #f07871; --yellow: #eec35c; --blue: #83b8e6;
  }
  [data-theme="light"] {
    --bg: #eeebe4; --bg-alt: #ffffff; --surface: #ffffff; --surface-2: #f2ede4;
    --border: #9d8e73; --border-soft: #c9bfae;
    --text: #16110c; --text-dim: #4c443a; --text-faint: #756a5c;
    --accent: #d4661f; --accent-dim: #b4551a; --accent-glow: rgba(212,102,31,0.16);
    --green: #327140; --red: #b33a32; --yellow: #93690a; --blue: #285d87;
  }
  [data-theme="purple"] {
    --bg: #120a1c; --bg-alt: #1c1030; --surface: #1c1030; --surface-2: #241541;
    --border: #7a5aad; --border-soft: #4a3570;
    --text: #f3eefc; --text-dim: #c3b0dd; --text-faint: #8a76ab;
    --accent: #b478f0; --accent-dim: #9355d1; --accent-glow: rgba(180,120,240,0.22);
    --green: #7fdcb8; --red: #f07871; --yellow: #eec35c; --blue: #83b8e6;
  }
  /* ---- the "sharp" family: pure black/white, maximum border-vs-surface
     contrast, for anyone who wants edges over ambience. blueSharp is the
     app default (bound to bare html), matching Passport's own default. ---- */
  /* --surface used to sit at the exact same value as --bg here, so a
     .panel/.stat-card (background: var(--surface)) was pixel-identical to
     the page behind it — distinguishable only by a 1px border that some
     laptop panels don't render crisply, making the whole page look like
     an empty black slab. Brightened a step above --bg (still short of
     --surface-2) so panels read as raised surfaces even when that border
     doesn't show. */
  html, [data-theme="blueSharp"] {
    --bg: #000000; --bg-alt: #0a0a0a; --surface: #131313; --surface-2: #1c1c1c;
    --border: #ffffff; --border-soft: #666666;
    --text: #ffffff; --text-dim: #cccccc; --text-faint: #999999;
    --accent: #00e5ff; --accent-dim: #00b8cc; --accent-glow: rgba(0,229,255,0.25);
    --green: #00ff85; --red: #ff3b3b; --yellow: #ffe135; --blue: #00e5ff;
  }
  [data-theme="purpleSharp"] {
    --bg: #000000; --bg-alt: #0a0a0a; --surface: #131313; --surface-2: #1c1c1c;
    --border: #ffffff; --border-soft: #666666;
    --text: #ffffff; --text-dim: #cccccc; --text-faint: #999999;
    --accent: #b45cff; --accent-dim: #8e3fd1; --accent-glow: rgba(180,92,255,0.25);
    --green: #00ff85; --red: #ff3b3b; --yellow: #ffe135; --blue: #b45cff;
  }

  * { box-sizing: border-box; }
  /* Nothing should ever be able to make the whole PAGE scroll sideways —
     a wrapper that actually wants horizontal scroll (.table-scroll)
     declares that itself. */
  html, body { overflow-x: hidden; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); transition: background .2s, color .2s; }
  /* A toned-down echo of the login screen's own glow (.center-screen::before
     below, opacity .8) behind the signed-in app too. Deliberately non-negative
     z-index, same as .center-screen/.card below — a fixed+negative-z-index
     layer with no positioned ancestor can fail to composite at all on weak/
     blocklisted GPUs (it never paints, though it's fine on a capable GPU), so
     #app gets its own stacking context above this instead of pushing the glow
     below zero. Only actually shows through where a child has no opaque
     background of its own (section.content is transparent; header/nav aren't,
     so they stay fully legible). */
  body::before {
    content: ''; position: fixed; inset: -10%; z-index: 0; pointer-events: none;
    background: radial-gradient(circle at 25% 15%, var(--accent-glow), transparent 50%),
                radial-gradient(circle at 85% 85%, var(--accent-glow), transparent 45%);
    opacity: .2;
  }
  #app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
  a { color: var(--accent); }
  ::selection { background: var(--accent-glow); }

  * { scrollbar-width: thin; scrollbar-color: var(--border) var(--bg-alt); }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-track { background: var(--bg-alt); }
  ::-webkit-scrollbar-thumb { background-color: var(--border); border-radius: 20px; border: 2px solid var(--bg-alt); }
  ::-webkit-scrollbar-thumb:hover { background-color: var(--accent-dim); }
  ::-webkit-scrollbar-corner { background: var(--bg-alt); }

  .brandmark { display: flex; align-items: center; gap: 9px; font-weight: 800; letter-spacing: 0.01em; font-size: 16px; }
  .brandmark .logo { width: 26px; height: 26px; flex-shrink: 0; }
  .brandmark .ring { stroke: var(--text-dim); }
  .brandmark .bar { fill: var(--accent); }
  .brandmark .word span { color: var(--accent); }

  .center-screen { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; overflow: hidden; }
  .center-screen::before {
    content: ''; position: absolute; inset: -20%; z-index: 0; pointer-events: none;
    background: radial-gradient(circle at 30% 20%, var(--accent-glow), transparent 55%),
                radial-gradient(circle at 80% 80%, var(--accent-glow), transparent 45%);
    opacity: .8;
  }
  .card { position: relative; z-index: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 34px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.35); }
  .card .brandmark { justify-content: center; margin-bottom: 6px; font-size: 20px; }
  .card .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 22px; text-align: center; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--text-dim); margin: 14px 0 6px; letter-spacing: .01em; }
  input, select, textarea { width: 100%; background: var(--bg-alt); border: 1px solid var(--border); color: var(--text); border-radius: 7px; padding: 10px 11px; font-size: 14px; font-family: var(--sans); }
  /* Checkboxes/radios have a fixed native size — the width:100% above
     (meant for text/select/textarea fields) was stretching them across
     the whole row instead, shoving their label text far off to the right. */
  input[type="checkbox"], input[type="radio"] { width: auto; padding: 0; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-dim); box-shadow: 0 0 0 3px var(--accent-glow); }
  button { cursor: pointer; border: none; border-radius: 7px; padding: 9px 15px; font-size: 13px; font-weight: 600; font-family: var(--sans); transition: transform .08s, background .15s, border-color .15s, color .15s; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:disabled:active { transform: none; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-dim)); color: #1a1008; }
  [data-theme="light"] .btn-primary { color: #fff; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: var(--text-faint); }
  .btn-danger { background: transparent; color: var(--red); border: 1px solid var(--red); opacity: .85; }
  .btn-danger:hover { opacity: 1; background: rgba(229,103,95,0.08); }
  .btn-block { width: 100%; margin-top: 20px; padding: 11px; font-size: 14px; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .err { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 16px; }
  .hint { color: var(--text-faint); font-size: 12px; margin-top: 4px; line-height: 1.5; }

  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 14px 24px; border-bottom: 1px solid var(--border-soft); background: var(--bg-alt); }
  header .who { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text-dim); }
  .avatar-chip { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: var(--accent); flex-shrink: 0; }
  .role-pill { font-size: 10px; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
  .role-pill.trustedInstaller, .role-pill.systemAdministrator, .role-pill.owner { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-glow); }
  .role-pill.elevatedStaff, .role-pill.admin { color: var(--blue); border-color: var(--blue); }
  .role-pill.staff, .role-pill.moderator { color: var(--text-dim); }

  /* min-width: 0 overrides a flex item's default min-width:auto — without
     it, a flex child never shrinks below its content's natural width, so
     one wide thing inside `content` (a table wanting to be 540px+, say)
     pushes `content` itself wider than the space `nav` actually left it,
     and the whole page ends up scrolling sideways instead of just that
     one thing. */
  main { flex: 1; display: flex; min-width: 0; }
  nav { width: 208px; border-right: 1px solid var(--border-soft); padding: 18px 12px; background: var(--bg-alt); }
  nav .navlabel { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); padding: 4px 12px 8px; }
  nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; color: var(--text-dim); padding: 9px 12px; border-radius: 8px; font-weight: 600; margin-bottom: 2px; font-size: 13px; }
  nav button svg { width: 16px; height: 16px; flex-shrink: 0; opacity: .8; }
  nav button:hover { background: var(--surface-2); color: var(--text); }
  nav button.active { background: var(--accent-glow); color: var(--accent); }
  nav button.active svg { opacity: 1; }
  section.content { flex: 1; min-width: 0; padding: 30px 34px; max-width: 960px; animation: fadein .18s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  /* Triggered on a login/MFA card via shakeEl() on a failed attempt. */
  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
  .shake { animation: shake .4s cubic-bezier(.36,.07,.19,.97) both; }
  h2 { font-size: 19px; margin: 0 0 4px; display: flex; align-items: center; gap: 9px; }
  .pagesub { color: var(--text-faint); font-size: 13px; margin-bottom: 22px; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 26px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .stat-card .num { font-size: 26px; font-weight: 800; color: var(--accent); line-height: 1.1; overflow-wrap: anywhere; }
  .stat-card .num.long-text { font-size: 18px; }
  .stat-card .label { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; margin-bottom: 18px; }
  .panel h3 { margin: 0 0 14px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .panel h3 svg, .modal h3 svg { width: 15px; height: 15px; color: var(--accent); flex-shrink: 0; }

  /* Every table gets wrapped in this (see tableWrap() below) so a row too
     wide for a phone screen scrolls WITHIN the table instead of pushing
     the whole page sideways, leaving everything but the last column and
     the row's action button off-screen with no visual separation between
     the truncated text and the button next to it. */
  .table-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .table-scroll table { min-width: 540px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
  /* An empty cell (a row with no action buttons, say) has zero content, so
     height: auto collapses it below its siblings on the same row —
     min-height doesn't help, table cells don't reliably honor it when
     truly empty. A non-breaking space gives the cell a real line box the
     same height as any other row's text. */
  .row-actions:empty::after { content: "\00a0"; line-height: 27px; } /* ~= a .btn-sm's rendered height */
  th { color: var(--text-faint); font-weight: 600; text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.04em; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface-2); }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 5px; border: 1px solid var(--border); color: var(--text-dim); display: inline-block; }
  .badge.ok { color: var(--green); border-color: var(--green); }
  .badge.warn { color: var(--yellow); border-color: var(--yellow); }
  .badge.off { color: var(--red); border-color: var(--red); }
  .row-actions { display: flex; gap: 6px; justify-content: flex-end; }
  /* The buttons column used to scroll away with the rest of a wide row
     inside .table-scroll — reachable, but only after scrolling every
     other column out of view first. Pins it to the right edge of the
     scroll box instead, both header and body cells (see tableHeaders()),
     with its own background so scrolled-under columns don't show through. */
  .table-scroll .row-actions { position: sticky; right: 0; z-index: 1; background: var(--surface); border-left: 1px solid var(--border-soft); }
  .table-scroll tr:hover td.row-actions { background: var(--surface-2); }
  .name-cell { display: flex; align-items: center; gap: 10px; }
  .mono { font-family: var(--mono); font-size: 12px; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
  .toolbar input[type=text] { max-width: 220px; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; z-index: 50; animation: fadein .12s ease; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; width: 480px; max-width: 92vw; max-height: 86vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 16px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .modal-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 20px; }
  .modal-actions .right { display: flex; gap: 8px; margin-left: auto; }
  .muted { color: var(--text-faint); font-size: 12px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--surface); border: 1px solid var(--border); padding: 12px 16px; border-radius: 9px; font-size: 13px; z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,0.3); animation: fadein .15s ease; }
  .toast.err { border-color: var(--red); color: var(--red); }
  .toast.ok { border-color: var(--green); color: var(--green); }
  .checkline { display: flex; align-items: center; gap: 9px; margin: 12px 0; font-size: 13px; }
  .checkline input { width: auto; }
  .divider { height: 1px; background: var(--border-soft); margin: 20px 0; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .domain-chip-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; max-height: 220px; overflow-y: auto; }
  .domain-chip { display: flex; align-items: center; gap: 6px; background: var(--bg-alt); border: 1px solid var(--border); border-radius: 20px; padding: 4px 6px 4px 12px; font-size: 12px; font-family: var(--mono); }
  .domain-chip button { background: none; border: none; color: var(--text-faint); padding: 2px 6px; font-size: 13px; line-height: 1; border-radius: 50%; }
  .domain-chip button:hover { color: var(--red); background: rgba(229,103,95,0.12); }
  .empty-note { color: var(--text-faint); font-size: 13px; padding: 10px 0; }

  .filter-bar { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-bar .fgroup { display: flex; flex-direction: column; gap: 4px; }
  .filter-bar .fgroup label { margin: 0; }
  .filter-bar input, .filter-bar select { padding: 8px 10px; font-size: 13px; width: auto; }

  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,0.3); border-top-color: currentColor; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

const ICONS = {
  dashboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  blocklist: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>',
  fingerprints: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 00-9 9c0 2.5 1 4.5 2 6"/><path d="M12 3a9 9 0 019 9c0 3-1 5-2 7"/><path d="M12 7a5 5 0 00-5 5c0 2 .5 3.5 1.5 5"/><path d="M12 7a5 5 0 015 5c0 2.5-.7 4-1.5 5.5"/><path d="M12 11a1 1 0 00-1 1c0 3 1 5 2 7"/></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.9 7.9 0 000-2l2-1.5-2-3.5-2.4.5a8 8 0 00-1.7-1L15 3h-6l-.3 2.5a8 8 0 00-1.7 1l-2.4-.5-2 3.5L4.6 11a7.9 7.9 0 000 2l-2 1.5 2 3.5 2.4-.5a8 8 0 001.7 1L9 21h6l.3-2.5a8 8 0 001.7-1l2.4.5 2-3.5-2-1.5z"/></svg>',
  activity: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg>',
  key: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 5l3 3M13 8l2 2"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
  globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 4 6 4 9s-1.5 6.5-4 9c-2.5-2.5-4-6-4-9s1.5-6.5 4-9z"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  whitelist: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
};

const state = { profile: null, view: 'dashboard', canManage: false, canConfigure: false, gusBaseUrl: '' };

async function api(path, opts = {}) {
  const res = await fetch('/manage/api' + path, {
    method: opts.method || 'GET',
    headers: opts.body ? { 'Content-Type': 'application/json' } : {},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* no body */ }
  if (!res.ok) throw new Error((data && data.error) || 'Request failed (' + res.status + ')');
  return data;
}

const THEMES = ['ember', 'ocean', 'forest', 'light', 'purple', 'blueSharp', 'purpleSharp'];
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme && THEMES.includes(theme) ? theme : 'blueSharp');
}

function toast(msg, kind) {
  const el2 = document.createElement('div');
  el2.className = 'toast ' + (kind || '');
  el2.textContent = msg;
  document.body.appendChild(el2);
  setTimeout(() => el2.remove(), 3200);
}

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (v === null || v === undefined) return;
    if (k === 'text') node.textContent = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  });
  (children || []).forEach((c) => c && node.appendChild(c));
  return node;
}

function icon(name) { return el('span', { html: ICONS[name] || '' }); }
function initials(name) { return (name || '?').trim().charAt(0).toUpperCase(); }

/** Wrap any <table> in this before inserting it — see the .table-scroll CSS rule for why. */
function tableWrap(table) { return el('div', { class: 'table-scroll' }, [table]); }

/**
 * Build a table's header row from plain label strings — the trailing ''
 * every actions-column table uses for its buttons header gets tagged
 * 'row-actions' too, so the sticky-column CSS (.table-scroll .row-actions)
 * keeps that header cell glued to the same spot as the row-actions <td>s
 * under it while the table scrolls horizontally.
 */
function tableHeaders(labels) {
  return labels.map((h) => el('th', { text: h, class: h === '' ? 'row-actions' : null }));
}

/**
 * Restarts the .shake CSS animation on `elm` (a failed login/MFA card).
 * Just re-adding an already-present class doesn't restart a running or
 * just-finished CSS animation, so this drops the class, forces a reflow,
 * then re-adds it.
 */
function shakeEl(elm) {
  elm.classList.remove('shake');
  void elm.offsetWidth;
  elm.classList.add('shake');
}

const ROLE_LABELS = { trustedInstaller: 'Provider', systemAdministrator: 'Sysadmin', elevatedStaff: 'ElevatedAdmins', staff: 'StaffUsers' };
function roleLabel(role) { return ROLE_LABELS[role] || role; }

function avatarNode(user) {
  if (user && user.avatarExt && state.gusBaseUrl) {
    return el('img', { class: 'avatar-chip', src: state.gusBaseUrl + '/avatars/' + user.uid + '.' + user.avatarExt, alt: '' });
  }
  return el('div', { class: 'avatar-chip', text: initials(user ? user.username : '?') });
}

function brandmark() {

    '<circle class="ring" cx="13" cy="13" r="10.5" fill="none" stroke-width="1.6" opacity=".5"/>' +
    '<path class="bar" d="M8 15.5a5 5 0 015-5h1.2a3 3 0 000-6H9v1.8" stroke="var(--accent)" stroke-width="2" fill="none" stroke-linecap="round"/>' +
    '<circle class="bar" cx="9" cy="17.5" r="1.6"/></svg>';
  return el('div', { class: 'brandmark', html: logo + '<span class="word">Proxy<span>Stop</span></span>' });

/* ---------------- session ---------------- */
// Shared by boot() (GET /session) and a completed login (POST /session/login
// or /session/login/mfa) — all three respond the same {profile,
// requirePasswordChange, canManage, gusBaseUrl} shape.
function applySession(result) {
  state.profile = result.profile;
  state.canManage = !!result.canManage;
  state.canConfigure = !!result.canConfigure;
  state.gusBaseUrl = result.gusBaseUrl || '';
  applyTheme(result.profile.theme);
  if (result.requirePasswordChange) return renderForceChange();
  render();
}

/* ---------------- boot ---------------- */
async function boot() {
  applyTheme('blueSharp');
  try {
    applySession(await api('/session'));
  } catch (e) {
    renderLogin();
  }
}

/* ---------------- login ---------------- */
function renderLogin(message) {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const errEl = el('div', { class: 'err', text: message || '' });
  const username = el('input', { type: 'text', autocomplete: 'username', placeholder: 'yourname' });
  const password = el('input', { type: 'password', autocomplete: 'current-password', placeholder: '••••••••' });
  const submitBtn = el('button', { class: 'btn-primary btn-block', text: 'Sign in' });

  async function submit() {
    errEl.textContent = '';
    submitBtn.disabled = true;
    try {
      const result = await api('/session/login', {
        method: 'POST', body: { username: username.value, password: password.value },
      });
      if (result.mfaRequired) return renderMfaChallenge();
      applySession(result);
    } catch (e) { errEl.textContent = e.message; shakeEl(form); }
    finally { submitBtn.disabled = false; }
  }
  submitBtn.addEventListener('click', submit);

  const form = el('div', { class: 'card' }, [
    brandmark(),
    el('div', { class: 'sub', text: 'Management Console — sign in with your GUS account' }),
    el('label', { text: 'Username' }), username,
    el('label', { text: 'Password' }), password,
    errEl,
    submitBtn,
  ]);
  password.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  app.appendChild(el('div', { class: 'center-screen' }, [form]));
  username.focus();
}

/* ---------------- MFA challenge ----------------
 * Dormant until a sysadmin opts ProxyStop into MFA challenges from
 * Passport's Apps tab — /session/login only ever asks for this when
 * Passport itself returned good_mfa_required. */
function renderMfaChallenge() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const errEl = el('div', { class: 'err' });
  const code = el('input', { type: 'text', inputmode: 'numeric', autocomplete: 'one-time-code', placeholder: '123456' });
  const submitBtn = el('button', { class: 'btn-primary btn-block', text: 'Verify' });

  async function submit() {
    errEl.textContent = '';
    submitBtn.disabled = true;
    try {
      applySession(await api('/session/login/mfa', { method: 'POST', body: { code: code.value } }));
    } catch (e) { errEl.textContent = e.message; shakeEl(form); }
    finally { submitBtn.disabled = false; }
  }
  submitBtn.addEventListener('click', submit);
  code.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });

  const form = el('div', { class: 'card' }, [
    brandmark(),
    el('div', { class: 'sub', text: 'Enter the code from your authenticator app, or a backup code.' }),
    el('label', { text: 'Verification code' }), code,
    errEl,
    submitBtn,
    el('button', { class: 'btn-ghost btn-block', text: 'Back to sign in', style: 'margin-top:8px', onclick: () => renderLogin() }),
  ]);
  app.appendChild(el('div', { class: 'center-screen' }, [form]));
  code.focus();
}

/* ---------------- shell ---------------- */
function render() {
  startAutoLogoff();
  const app = document.getElementById('app');
  app.innerHTML = '';

  const tabs = [['dashboard', 'Dashboard', 'dashboard'], ['fingerprints', 'Fingerprints', 'fingerprints'], ['blocklist', 'Blocklist', 'blocklist'], ['whitelist', 'Whitelist', 'whitelist']];
  if (state.canConfigure) tabs.push(['config', 'Configuration', 'settings']);

  const navEl = el('nav', {}, [
    el('div', { class: 'navlabel', text: 'Navigate' }),
    ...tabs.map(([id, label, ic]) =>
      el('button', {
        class: state.view === id ? 'active' : '',
        onclick: () => { state.view = id; render(); },
      }, [icon(ic), el('span', { text: label })])
    ),
  ]);

  const header = el('header', {}, [
    brandmark(),
    el('div', { class: 'who' }, [
      el('span', { class: 'role-pill ' + state.profile.role, text: roleLabel(state.profile.role) }),
      avatarNode(state.profile),
      el('span', { text: state.profile.username }),
      el('button', { class: 'btn-ghost btn-sm', text: 'Sign out', onclick: logout }),
    ]),
  ]);

  const content = el('section', { class: 'content', id: 'content' });
  // header and main go straight onto #app (not wrapped in an extra div) —
  // #app is the flex column that stretches `main` to fill the viewport
  // (see main{flex:1}); a wrapping div here isn't a flex item of #app, so
  // main falls back to shrinking to its own content height and nav's
  // background stops exactly at the bottom of whatever panel is showing
  // instead of running the full height of the page.
  app.appendChild(header);
  app.appendChild(el('main', {}, [navEl, content]));

  if (state.view === 'dashboard') renderDashboard(content);
  if (state.view === 'fingerprints') renderFingerprints(content);
  if (state.view === 'blocklist') renderBlocklist(content);
  if (state.view === 'whitelist') renderWhitelist(content);
  if (state.view === 'config' && state.canConfigure) renderConfig(content);
}

async function logout() {
  stopAutoLogoff();
  await api('/session/logout', { method: 'POST' });
  state.profile = null;
  renderLogin();
}

/* ---------------- automatic logoff ----------------
 * Signs the session out after sitting idle for 10 minutes, same pattern
 * as Passport's own admin console. */
const AUTO_LOGOFF_IDLE_MS = 10 * 60 * 1000;
const AUTO_LOGOFF_HEARTBEAT_MS = 15 * 1000;
const AUTO_LOGOFF_ACTIVITY_EVENTS = ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll', 'wheel'];
let autoLogoff = null; // { timer, lastActivityAt } while signed in, else null

function markAutoLogoffActivity() {
  if (autoLogoff) autoLogoff.lastActivityAt = Date.now();
}

async function triggerAutoLogoff(message) {
  stopAutoLogoff();
  try { await api('/session/logout', { method: 'POST' }); } catch (e) { /* best effort — we're leaving the app either way */ }
  state.profile = null;
  renderLogin();
  toast(message, 'ok');
}

function startAutoLogoff() {
  if (autoLogoff) return;
  autoLogoff = { lastActivityAt: Date.now(), timer: null };
  AUTO_LOGOFF_ACTIVITY_EVENTS.forEach((evt) => window.addEventListener(evt, markAutoLogoffActivity, { passive: true }));
  autoLogoff.timer = setInterval(() => {
    if (Date.now() - autoLogoff.lastActivityAt >= AUTO_LOGOFF_IDLE_MS) {
      triggerAutoLogoff('Signed out automatically after 10 minutes of inactivity.');
    }
  }, AUTO_LOGOFF_HEARTBEAT_MS);
}

function stopAutoLogoff() {
  if (!autoLogoff) return;
  clearInterval(autoLogoff.timer);
  AUTO_LOGOFF_ACTIVITY_EVENTS.forEach((evt) => window.removeEventListener(evt, markAutoLogoffActivity));
  autoLogoff = null;
}

/* ---------------- blocklist ---------------- */
async function renderBlocklist(content) {
  let sites;
  try { sites = await api('/blocklist'); }
  catch (e) { content.innerHTML = ''; content.appendChild(el('div', { class: 'err', text: e.message })); return; }
  content.innerHTML = '';

  async function removeSite(site) {
    if (!confirm('Remove "' + site + '" from the blocklist?')) return;
    try {
      await api('/blocklist/' + encodeURIComponent(site), { method: 'DELETE' });
      toast('Removed from blocklist', 'ok');
      renderBlocklist(content);
    } catch (e) { toast(e.message, 'err'); }
  }

  function makeRow(site) {
    return el('tr', {}, [
      el('td', { class: 'mono', text: site }),
      el('td', { class: 'row-actions' }, [
        state.canManage ? el('button', { class: 'btn-danger btn-sm', text: 'Remove', onclick: () => removeSite(site) }) : null,
      ]),
    ]);
  }

  const search = el('input', { type: 'text', placeholder: 'Search blocklist…' });
  const tbody = el('tbody', {}, sites.map(makeRow));
  search.addEventListener('input', () => {
    const q = search.value.toLowerCase();
    tbody.innerHTML = '';
    sites.filter((s) => s.toLowerCase().includes(q)).forEach((s) => tbody.appendChild(makeRow(s)));
  });

  content.appendChild(el('div', {}, [
    el('h2', {}, [icon('blocklist'), el('span', { text: 'Blocklist' })]),
    el('div', { class: 'pagesub', text: sites.length + ' site' + (sites.length === 1 ? '' : 's') + ' automatically blocklisted after a confirmed proxy match.' }),
    sites.length
      ? el('div', {}, [
          el('div', { class: 'toolbar' }, [search]),
          tableWrap(el('table', {}, [
            el('thead', {}, [el('tr', {}, tableHeaders(['Site', '']))]),
            tbody,
          ])),
        ])
      : el('div', { class: 'panel' }, [el('div', { class: 'empty-note', text: 'No sites have been blocklisted yet.' })]),
  ]));
}

/* ---------------- fingerprints ---------------- */
function formatBytes(bytes) {
  if (!bytes) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB'];
  const i = Math.min(units.length - 1, Math.floor(Math.log(bytes) / Math.log(1024)));
  return (bytes / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
}

async function renderFingerprints(content) {
  let fingerprints;
  try { fingerprints = await api('/fingerprints'); }
  catch (e) { content.innerHTML = ''; content.appendChild(el('div', { class: 'err', text: e.message })); return; }
  content.innerHTML = '';

  function makeRow(f) {
    return el('tr', {}, [
      el('td', {}, [el('div', { class: 'name-cell' }, [icon('fingerprints'), el('span', { text: f.name })])]),
      el('td', { text: f.fileCount + ' file' + (f.fileCount === 1 ? '' : 's') }),
      el('td', { text: formatBytes(f.totalBytes) }),
      el('td', { text: f.updatedAt ? new Date(f.updatedAt).toLocaleDateString() : '—' }),
      el('td', { class: 'row-actions' }, [
        el('button', { class: 'btn-ghost btn-sm', text: 'Files', onclick: () => openFingerprintFilesModal(f) }),
        state.canManage ? el('button', { class: 'btn-danger btn-sm', text: 'Delete', onclick: () => deleteFingerprint(f) }) : null,
      ]),
    ]);
  }

  async function deleteFingerprint(f) {
    if (!confirm('Delete fingerprint "' + f.name + '"? This cannot be undone.')) return;
    try {
      await api('/fingerprints/' + encodeURIComponent(f.name), { method: 'DELETE' });
      toast('Fingerprint deleted', 'ok');
      renderFingerprints(content);
    } catch (e) { toast(e.message, 'err'); }
  }

  content.appendChild(el('div', {}, [
    el('h2', {}, [icon('fingerprints'), el('span', { text: 'Fingerprints' })]),
    el('div', { class: 'pagesub', text: fingerprints.length + ' fingerprint' + (fingerprints.length === 1 ? '' : 's') + ' used to detect proxy unblockers.' }),
    el('div', { class: 'toolbar' }, [
      el('div'),
      state.canManage ? el('button', { class: 'btn-primary', text: '+ New fingerprint', onclick: () => openNewFingerprintModal(content) }) : null,
    ]),
    fingerprints.length
      ? tableWrap(el('table', {}, [
          el('thead', {}, [el('tr', {}, tableHeaders(['Name', 'Files', 'Size', 'Updated', '']))]),
          el('tbody', {}, fingerprints.map(makeRow)),
        ]))
      : el('div', { class: 'panel' }, [el('div', { class: 'empty-note', text: 'No fingerprints yet.' })]),
  ]));
}

function openFingerprintFilesModal(f) {
  const body = [el('h3', {}, [icon('fingerprints'), el('span', { text: f.name })]), el('div', { class: 'muted', text: 'Loading files…' })];
  openModal(body);
  api('/fingerprints/' + encodeURIComponent(f.name) + '/files').then((files) => {
    body.length = 0;
    body.push(
      el('h3', {}, [icon('fingerprints'), el('span', { text: f.name })]),
      files.length
        ? el('div', { class: 'domain-chip-list' }, files.map((path) => el('div', { class: 'domain-chip mono', text: path })))
        : el('div', { class: 'empty-note', text: 'No files found.' }),
      el('div', { class: 'modal-actions' }, [el('div', { class: 'right' }, [el('button', { class: 'btn-ghost', text: 'Close', onclick: closeModal })])]),
    );
    reopenModal(body);
  }).catch((e) => {
    reopenModal([el('div', { class: 'err', text: e.message }), el('div', { class: 'modal-actions' }, [el('div', { class: 'right' }, [el('button', { class: 'btn-ghost', text: 'Close', onclick: closeModal })])])]);
  });
}

function openNewFingerprintModal(content) {
  const name = el('input', { type: 'text', placeholder: 'e.g. genericproxy' });
  const url = el('input', { type: 'text', placeholder: 'https://proxysite.example.com' });
  const errEl = el('div', { class: 'err' });
  const submitBtn = el('button', { class: 'btn-primary', text: 'Create' });

  async function submit() {
    errEl.textContent = '';
    submitBtn.disabled = true;
    submitBtn.innerHTML = '';
    submitBtn.appendChild(el('span', { class: 'spinner' }));
    submitBtn.appendChild(document.createTextNode('Scraping…'));
    try {
      await api('/fingerprints', { method: 'POST', body: { name: name.value, url: url.value } });
      closeModal();
      toast('Fingerprint created', 'ok');
      renderFingerprints(content);
    } catch (e) {
      errEl.textContent = e.message;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create';
    }
  }

  openModal([
    el('h3', {}, [icon('plus'), el('span', { text: 'New fingerprint' })]),
    el('div', { class: 'hint', text: 'Scrapes the given URL for <script> sources and stores their JavaScript as a fingerprint used for proxy detection. This can take a few seconds.' }),
    el('label', { text: 'Fingerprint name' }), name,
    el('label', { text: 'Source URL' }), url,
    errEl,
    el('div', { class: 'modal-actions' }, [
      el('div', { class: 'right' }, [
        el('button', { class: 'btn-ghost', text: 'Cancel', onclick: closeModal }),
        submitBtn,
      ]),
    ]),
  ]);
  submitBtn.addEventListener('click', submit);
}

  const maxDepth = el('input', { type: 'number', value: config.app.Scraper.maxDepth });
  const maxPages = el('input', { type: 'number', value: config.app.Scraper.maxPages });
  const managementEnabled = el('input', { type: 'checkbox' }); managementEnabled.checked = !!config.app.managementServer.enabled;

  async function save() {
    try {
      await api('/config', {
        method: 'PUT',
        body: {
          Host: { host: host.value, port: port.value },
          app: {
            Fingerprints: {
              db: { foldername: folder.value, reloadInterval: reloadInterval.value, minimumConfidence: minimumConfidence.value },
              ReportsParams: { blankContents: blankContents.value, entryFormat: entryFormat.value, reportExpiry: reportExpiry.checked },
            },
            Scraper: { recursive: recursive.checked, maxDepth: maxDepth.value, maxPages: maxPages.value },
            managementServer: { enabled: managementEnabled.checked },
          },
        },
      });
      toast('Configuration saved', 'ok');
    } catch (e) { toast(e.message, 'err'); }
  }

  content.appendChild(el('div', {}, [
    el('h2', {}, [icon('settings'), el('span', { text: 'Configuration' })]),
    el('div', { class: 'pagesub', text: 'Server, fingerprinting, and scraper settings.' }),

    el('div', { class: 'panel' }, [
      el('h3', {}, [icon('globe'), el('span', { text: 'Server' })]),
      el('div', { class: 'field-row' }, [
        el('div', {}, [el('label', { text: 'Bind host' }), host]),
        el('div', {}, [el('label', { text: 'Port' }), port]),
      ]),
      el('div', { class: 'hint', text: 'Changing the host or port requires a server restart to take effect.' }),
    ]),

    el('div', { class: 'panel' }, [
      el('h3', {}, [icon('fingerprints'), el('span', { text: 'Fingerprint detection' })]),
      el('label', { text: 'Fingerprints folder name' }), folder,
      el('div', { class: 'field-row' }, [
        el('div', {}, [el('label', { text: 'Minimum confidence (%)' }), minimumConfidence]),
        el('div', {}, [el('label', { text: 'Reload interval (ms)' }), reloadInterval]),
      ]),
    ]),

    el('div', { class: 'panel' }, [
      el('h3', {}, [icon('activity'), el('span', { text: 'Reports' })]),
      el('label', { text: 'Blank report contents' }), blankContents,
      el('label', { text: 'Entry format (use {url})' }), entryFormat,
      el('div', { class: 'checkline' }, [reportExpiry, el('span', { text: 'Reports expire' })]),
    ]),

    el('div', { class: 'panel' }, [
      el('h3', {}, [icon('globe'), el('span', { text: 'Scraper' })]),
      el('div', { class: 'checkline' }, [recursive, el('span', { text: 'Recursive scraping' })]),
      el('div', { class: 'field-row' }, [
        el('div', {}, [el('label', { text: 'Max depth' }), maxDepth]),
        el('div', {}, [el('label', { text: 'Max pages' }), maxPages]),
      ]),
    ]),

    el('div', { class: 'panel' }, [
      el('h3', {}, [icon('settings'), el('span', { text: 'Management server' })]),
      el('div', { class: 'checkline' }, [managementEnabled, el('span', { text: 'Enabled' })]),
      el('div', { class: 'hint', text: 'Disabling this locks everyone — including you — out of this console until it is re-enabled directly in config.json.' }),
    ]),

    el('button', { class: 'btn-primary', text: 'Save configuration', onclick: save }),
  ]));
}

/* ---------------- modal helper ---------------- */
let currentBackdrop = null;
function openModal(children) {
  closeModal();
  const modal = el('div', { class: 'modal' }, children);
  currentBackdrop = el('div', { class: 'modal-backdrop', onclick: (e) => { if (e.target === currentBackdrop) closeModal(); } }, [modal]);
  document.body.appendChild(currentBackdrop);
}
function reopenModal(children) {
  if (!currentBackdrop) return openModal(children);
  const modal = currentBackdrop.querySelector('.modal');
  modal.innerHTML = '';
  children.forEach((c) => c && modal.appendChild(c));
}
function closeModal() {
  if (currentBackdrop) { currentBackdrop.remove(); currentBackdrop = null; }
}

boot();
</script>
</body>
</html>
